<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
</head>
<body>

<script>

function validateIBAN(iban) {
    if (!iban) return false;

    iban = iban.replace(/\s+/g, '').toUpperCase();
    if (!/^[A-Z0-9]+$/.test(iban)) return false;
    if (iban.length < 15 || iban.length > 34) return false;

    iban = iban.slice(4) + iban.slice(0, 4);
    iban = iban.replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);

    let remainder = iban;
    while (remainder.length > 2) {
        let block = remainder.slice(0, 9);
        remainder = (parseInt(block, 10) % 97) + remainder.slice(block.length);
    }

    return parseInt(remainder, 10) % 97 === 1;
}

(function waitForCRM() {

    if (!window.top.BX || !window.top.BX.Crm) {
        setTimeout(waitForCRM, 500);
        return;
    }

    window.top.BX.addCustomEvent(
        'BX.Crm.EntityEditor:onSave',
        function(event) {

            let editor = event.getData()[0];
            let ibanField = editor.getControlById('UF_CRM_IBAN');

            if (!ibanField) return;

            let iban = ibanField.getValue();
            if (!iban) return;

            if (!validateIBAN(iban)) {
                alert("❌ IBAN некорректный. Сохранение запрещено.");
                event.preventDefault();
            }
        }
    );

})();

</script>

</body>
</html>
